<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HairSalonMarija</title>
    <link rel="stylesheet" href="screen.css">
    <script type="text/javascript" src="jquery.js"></script>
    <script type="text/javascript" src="cycle2.js"></script>
    <script type="text/javascript" src="declarativeToggle.js"></script>
</head>
<body>

    <div class="header-area group">
        <header class="site-header">

        <div class="main-area">
            <a href="index.html"><img src="images/logo.PNG" alt="logo"></a>
        </div>

        <aside class="sidebar">
            <span data-toggle-target=".site-nav" class="toggle-btn">MENU</span>
        
        <nav class="site-nav">
            <ul class="group">
                <li><a href="index.html">HOME</a></li>
                <li><a href="services.html">SERVICES</a></li>
                <li><a href="aboutus.html">ABOUT US</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
        </aside>
        
        </header>
    </div>
    

    <div class="content-area group section">

        <!-- container -->
         <div class="container">

            <p> <strong>Hair salon Marija</strong> <em>since</em> <strong>1996</strong> </p>

            <!-- row -->
            <div class="row">

            <div class="col col-xs-10 main-area col-sm-10 col-md-10 col-lg-10">

                <div class="cycle-slideshow" data-cycle-slides=".slide" data-cycle-pause-on-hover="true">

                    <span class="cycle-prev">&laquo;</span>
                    <span class="cycle-next">&raquo;</span>

                    <span class="cycle-pager"></span>

                    <div class="slide">
                        <img src="images/logo.PNG" alt="logo">
                    </div>
                    
                    <div class="slide">
                        <img src="images/dukan1.jpg" alt="dukan1">
                    </div>

                    <div class="slide">
                        <img src="images/dukan2.jpg" alt="dukan2">
                    </div>

                    <div class="slide">
                        <img src="images/dukan3.jpg" alt="dukan3">
                    </div>
                </div>
                </div>
            </div>
         </div>
    </div>

    <footer>
        <P>Copyright &copy; 2026 Hair Salon Marija</P>
    </footer>
